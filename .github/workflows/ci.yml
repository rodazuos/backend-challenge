name: ci

on:
  push:
    branches: [main, rodrigo-souza-challenge]
  pull_request:
  workflow_dispatch:
    inputs:
      load_test:
        description: Run the load test (bun run test:load) against the docker compose stack
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · money-safety · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:money
      - run: bun run test:unit

  integration:
    name: integration · concurrency (real PostgreSQL + SQS)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Start PostgreSQL and MiniStack
        run: docker compose -f docker-compose.test.yml up -d --wait
      - run: bun run test:integration
      - run: bun run test:concurrency
      - name: Infra logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 200

  docker:
    name: docker image + compose smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build and start the stack (3 replicas behind nginx)
        run: |
          docker compose up -d --build
          # Readiness is internal-only (the edge answers 404 for it): probe a replica inside the network, then the edge.
          ready="fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
          for i in $(seq 1 90); do
            docker compose exec -T app bun -e "$ready" && curl -fsS localhost:8080/health/live && exit 0
            sleep 2
          done
          docker compose ps; exit 1
      - name: End-to-end demo through the load balancer
        run: bun run scripts/demo.ts
      - name: Load test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.load_test }}
        run: bun run test:load -- --duration 60
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
