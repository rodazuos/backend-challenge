# Round-robin load balancer in front of the app replicas (docker DNS returns one A record per replica).
events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream wagering {
    zone wagering 64k;
    server app:3000 resolve;
  }
  server {
    listen 80;
    client_max_body_size 32k;
    location / {
      proxy_pass http://wagering;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout;   # never retry non-idempotent requests on HTTP errors
      proxy_read_timeout 30s;
    }
  }
}
